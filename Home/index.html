    return `<div class="box"><b>Sign-in methods</b><p>${[pw && "Email & password", g && "Google"].filter(Boolean).join(", ") || "—"}</p></div>${pw ? `<div class="box"><b>Password</b><p class="note">We'll email you a secure link to set a new password.</p><button class="btn g" id="rp">Send password reset email</button> <span id="rm" class="note"></span></div>` : info("You sign in with Google, so your password is managed by your Google account.")}${info("<b>Privacy:</b> we never store your card details. Your orders and addresses are visible only to you and authorised store staff.")}`; },

    return `<form class="box fm" id="st"><label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)"><input type="checkbox" id="p1" style="width:auto"${pf.orderUpdates ? " checked" : ""}> Order and delivery updates</label><label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)"><input type="checkbox" id="p2" style="width:auto"${pf.offers ? " checked" : ""}> Offers and announcements</label><div><button class="btn g">Save preferences</button> <span id="sm" class="note"></span></div></form>`; }
};

let notes = [];
async function loadNotes() { const b = $("#nb"); if (!user) { notes = []; b.hidden = true; $("#np").hidden = true; return; } b.hidden = false;
  try { notes = (await getDocs(query(collection(db, "users", user.uid, "notifications"), limit(20)))).docs.map(d => ({ ref: d.ref, ...d.data() })).sort((a, c) => ms(c) - ms(a)); } catch (e) { console.error(e); notes = []; }
  $("#nc").textContent = notes.filter(n => !n.read).length || ""; }
async function openNotes() { const np = $("#np"); if (!np.hidden) return np.hidden = true; np.hidden = false;
  np.innerHTML = `<div class="n"><b>Notifications</b></div>${notes.length ? notes.slice(0, 6).map(n => `<div class="n${n.read ? "" : " u"}"><b>${esc(n.title)}</b><br><span class="note">${esc(n.body || "")}</span></div>`).join("") : `<div class="n note">You're all caught up — no notifications yet.</div>`}<div class="n"><a href="#/account/notifications" style="color:var(--forest);font-weight:600">View all notifications →</a></div>`;
  const un = notes.filter(n => !n.read); if (un.length) { $("#nc").textContent = ""; await Promise.allSettled(un.map(n => updateDoc(n.ref, { read: true }))); un.forEach(n => n.read = true); } }

async function pdpExtras(p) {
  const of = $("#pof"), rv = $("#prv"); if (!of || !rv || !p) return;
  if (!user) of.innerHTML = info(`${link(LOGIN, "Sign in")} to see offers and coupons available to you.`);
  else try { const now = Date.now(), l = (await getDocs(query(collection(db, "coupons"), where("active", "==", "active"), limit(50)))).docs.map(d => ({ id: d.id, ...d.data() })).filter(c => (!c.validTo?.toMillis || c.validTo.toMillis() >= now) && (!c.validFrom?.toMillis || c.validFrom.toMillis() <= now));
    of.innerHTML = l.length ? `<div class="grid">${l.map(c => `<div class="box" style="border-style:dashed;margin:0"><div class="pr">${esc(c.discountPercent)}% OFF</div><div class="note">Min. order ${inr(c.minPrice)}${c.maxDiscount ? ` · up to ${inr(c.maxDiscount)} off` : ""}${c.validTo ? ` · till ${esc(dt(c.validTo))}` : ""}</div><p style="margin-top:8px"><b>${esc(c.code || c.id)}</b> <button class="btn g" style="padding:4px 12px;width:auto" data-cp="${esc(c.code || c.id)}">Copy</button></p></div>`).join("")}</div>${info("Apply a code at checkout. Eligibility is checked there.")}` : none("No offers available right now."); }
  catch (e) { console.error(e); of.innerHTML = none("Offers couldn't be loaded right now."); }
  try { const l = (await getDocs(query(collection(db, "reviews"), where("productId", "==", p.id), where("status", "==", "approved"), limit(30)))).docs.map(d => d.data()).sort((a, b) => ms(b) - ms(a)), avg = l.length ? l.reduce((a, r) => a + (+r.rating || 0), 0) / l.length : 0;
    const mine = user ? (await getDocs(query(collection(db, "reviews"), where("uid", "==", user.uid), where("productId", "==", p.id), limit(1)))).docs[0]?.data() : null;
    const form = !user ? info(`${link(LOGIN, "Sign in")} to write a review.`) : mine ? info(`Thanks for reviewing this product — your review is <b>${esc(mine.status)}</b>.`) : `<form class="box fm" id="rf"><b>Write a review</b><div><label>Your rating</label><select id="rr">${[5, 4, 3, 2, 1].map(n => `<option value="${n}">${"★".repeat(n)} (${n})</option>`).join("")}</select></div><div><label>Your review</label><textarea id="rt" rows="3" maxlength="1000" placeholder="Share what you liked or didn't like"></textarea></div><div><button class="btn g">Submit review</button> <span id="rm2" class="note"></span></div></form>`;
    if (!$("#prv")) return;
    if ($("#rsum")) $("#rsum").innerHTML = l.length ? `<span class="star">${stars(avg)}</span> ${avg.toFixed(1)} · ${l.length} review${l.length === 1 ? "" : "s"}` : "No reviews yet";
    rv.innerHTML = `<div class="box rvs"><span class="pr" style="font-size:32px">${l.length ? avg.toFixed(1) : "—"}</span><div><span class="star">${stars(avg)}</span><br><span class="note">${l.length} review${l.length === 1 ? "" : "s"}</span></div></div>${l.map(r => `<div class="box"><span class="star">${stars(+r.rating)}</span> <b>${esc(r.userName || "Customer")}</b> <span class="note">${esc(dt(r.createdAt))}</span><p style="margin-top:6px;white-space:pre-line">${esc(r.text || "")}</p></div>`).join("")}${form}`;
    if ($("#rf")) $("#rf").onsubmit = async e => { e.preventDefault(); const rating = +$("#rr").value, text = $("#rt").value.trim(), m = $("#rm2");
      if (text.length < 5) return m.textContent = "Please write at least a few words.";
      try { await setDoc(doc(db, "reviews", `${user.uid}_${p.id}`), { uid: user.uid, productId: p.id, productName: p.name, userName: user.displayName || "Customer", rating, text, status: "pending", createdAt: serverTimestamp() }); $("#rf").outerHTML = info("Thank you! Your review will appear once our team has approved it."); } catch (x) { console.error(x); m.textContent = "Could not submit your review right now."; } };
  } catch (e) { console.error(e); if ($("#prv")) rv.innerHTML = none("Reviews couldn't be loaded right now."); }
}

let FAQ = null;
async function loadFaqs() { if (FAQ) return FAQ; try { FAQ = (await getDocs(query(collection(db, "faqs"), where("active", "==", true), limit(50)))).docs.map(d => d.data()).sort((a, b) => (+a.order || 999) - (+b.order || 999)); } catch (e) { console.error(e); FAQ = []; } return FAQ; }
async function fillFaq(el, page) {
  const l = await loadFaqs(); if (!el.isConnected) return;
  if (!l.length) return el.innerHTML = page ? none("Our FAQs are coming soon. In the meantime, we're happy to help — see Customer Support.") : "";
  const cats = [...new Set(l.map(f => f.category).filter(Boolean))]; let cur = "";
  const draw = () => { const items = l.filter(f => !cur || f.category === cur).slice(0, 10);   // max 10 per view
    el.innerHTML = (page ? "" : `<h2 class="s">Frequently asked questions<a href="#/faq">View all →</a></h2>`) + (cats.length ? `<div class="chips" style="margin-bottom:14px">${["", ...cats].map(c => `<a href="#" data-fc="${esc(c)}" style="${c === cur ? "background:var(--forest);color:#fff" : ""}">${c ? esc(c) : "All"}</a>`).join("")}</div>` : "") + items.map(f => `<details class="box"><summary><b>${esc(f.question)}</b></summary><p style="margin-top:8px;white-space:pre-line">${esc(f.answer)}</p></details>`).join("");
    el.querySelectorAll("[data-fc]").forEach(a => a.onclick = e => { e.preventDefault(); cur = a.dataset.fc; draw(); }); };
  draw();
}

/* ---------- router ---------- */
function route() {
  const [path, qs] = (location.hash.slice(1) || "/").split("?"), a = new URLSearchParams(qs || ""), v = $("#v"); $("#np").hidden = true;
  $("#cats").innerHTML = uniq("category").map(c => `<a href="#/shop?cat=${encodeURIComponent(c)}">${esc(c)}</a>`).join("") + (P.length ? `<a href="#/shop?sort=new">New arrivals</a>` : "") + `<a href="#/faq">FAQs</a>` + (cmp.length ? `<a href="#/compare">Compare (${cmp.length})</a>` : "");
  if (!loaded) return v.innerHTML = `<div class="wrap">${skel(8)}</div>`;
  if (failed && !path.startsWith("/account")) return v.innerHTML = err;
  if (path.startsWith("/account")) account(v, path.split("/")[2]); else if (path === "/shop") v.innerHTML = shop(a); else if (path.startsWith("/p/")) v.innerHTML = pdp(path.slice(3)); else if (path === "/faq") v.innerHTML = `<div class="wrap"><h2 class="s" style="margin-top:0">Frequently asked questions</h2><div id="faqp"></div></div>`; else if (path === "/wishlist") v.innerHTML = wishlist(); else if (path === "/compare") v.innerHTML = compare(); else v.innerHTML = home();
  scrollTo(0, 0); if ($("#faqh")) fillFaq($("#faqh"), false); if ($("#faqp")) fillFaq($("#faqp"), true); if (io) { io.disconnect(); io = null; } if (path.startsWith("/p/")) { const pp = P.find(x => x.id === path.slice(3)); pdpExtras(pp); pdpSetup(pp); pdpQA(pp); } clearInterval(hvT); const sl = document.querySelectorAll(".hv .sl"); if (sl.length > 1) { let i = 0; hvT = setInterval(() => { sl[i].classList.remove("on"); i = (i + 1) % sl.length; sl[i].classList.add("on"); }, 4000); }
  const fl = $("#fl"); if (fl) fl.onchange = () => { shown = 12; const n = new URLSearchParams(new FormData(fl)); [...n.keys()].forEach(k => !n.get(k) && n.delete(k)); location.hash = "#/shop?" + n; };
  if ($("#more")) $("#more").onclick = () => { shown += 12; route(); };
  if ($("#ac")) { let q = 1; const p = P.find(x => x.id === path.slice(3)), set = n => { q = Math.max(1, Math.min(n, stock(p))); $("#qv").textContent = q; }; $("#qm").onclick = () => set(q - 1); $("#qp").onclick = () => set(q + 1); $("#ac").onclick = () => { addCart(p.id, q, $("#ac")); const b = $("#ac"); b.textContent = "✓ Added"; setTimeout(() => { if (b.isConnected) b.textContent = "Add to cart"; }, 1300); };
    $("#bn").onclick = () => buyNow(p.id, q, $("#bn")); }
}
addEventListener("hashchange", route);
document.addEventListener("click", e => {
  if (!e.target.closest("#np,#nb")) $("#np").hidden = true;
  const t = e.target.closest("[data-add],[data-buy],[data-cq],[data-w],[data-q],[data-rm],[data-close],[data-cp]"); if (!t) return;
  if (t.dataset.cp) { navigator.clipboard?.writeText(t.dataset.cp); return toast("Code copied"); }
  if (t.dataset.buy) buyNow(t.dataset.buy, 1, t); else if (t.dataset.cq) cardQty(t); else if (t.dataset.add) addCart(t.dataset.add, 1, t); else if (t.dataset.w) { toggleWish(t.dataset.w); if (t.classList.contains("btn")) t.textContent = wish.includes(t.dataset.w) ? "♥ Saved" : "♡ Wishlist"; }
  else if (t.dataset.q) { const c = cart.find(x => x.id === t.dataset.q), p = P.find(x => x.id === t.dataset.q); if (c && p) { c.q = Math.max(1, Math.min(c.q + +t.dataset.d, stock(p))); save(); drawer(); } }
  else if (t.dataset.rm) { cart = cart.filter(x => x.id !== t.dataset.rm); save(); drawer(); } else closeDr();
});
$("#nb").onclick = openNotes; $("#cb").onclick = () => drawer(true); $("#ov").onclick = closeDr; addEventListener("keydown", e => e.key === "Escape" && closeDr());
$("#sf").onsubmit = e => { e.preventDefault(); const q = $("#q").value.trim(); location.hash = q ? "#/shop?q=" + encodeURIComponent(q) : "#/shop"; };
/* "Buy now" sets scs_pending. checkout.html must delete it after a successful payment; if it is still here, the customer left without buying, so we keep the item in their cart. */
function recoverPending() { let t; try { t = JSON.parse(localStorage.getItem("scs_pending")); localStorage.removeItem("scs_pending"); } catch {} if (!t || !P.length || Date.now() - t.t > 7 * 864e5) return;
  const p = P.find(x => x.id === t.id); if (p && stock(p) > 0 && !cart.some(c => c.id === p.id)) { cart.push({ id: p.id, q: Math.max(1, Math.min(+t.q || 1, stock(p))) }); toast(`We saved “${p.name}” in your cart`); } }
addEventListener("pageshow", e => { if (e.persisted && loaded) { document.querySelectorAll("[data-busy]").forEach(b => { b.textContent = b.dataset.t; delete b.dataset.busy; }); recoverPending(); save(); drawer(); } });
save(); route(); drawer(); loadProducts().then(() => { cart = cart.filter(c => P.some(p => p.id === c.id)); recoverPending(); save(); route(); drawer(); });

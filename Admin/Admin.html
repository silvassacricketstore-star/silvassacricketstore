  const paid = orders.filter(o => PAID.includes(o.status)), rev = paid.reduce((a, o) => a + (+o.grandTotal || 0), 0), day = {}, prod = {}, st = {};

  paid.forEach(o => { const k = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleDateString("sv") : "?"; (day[k] ||= { n: 0, r: 0 }); day[k].n++; day[k].r += +o.grandTotal || 0; (o.items || []).forEach(i => { const p = prod[i.name] ||= { q: 0, r: 0 }; p.q += +i.qty || 0; p.r += (+i.qty || 0) * (+i.price || 0); }); });
  const top = Object.entries(prod).sort((a, b) => b[1].r - a[1].r).slice(0, 10), days = Object.entries(day).sort().reverse();
  view.querySelector(".grid").outerHTML = `<div class="grid"><div class="card kpi"><small>Revenue (paid orders)</small><strong>${inr(rev)}</strong></div><div class="card kpi"><small>Orders (all)</small><strong>${orders.length}</strong></div><div class="card kpi"><small>Paid orders</small><strong>${paid.length}</strong></div><div class="card kpi"><small>Avg order value</small><strong>${paid.length ? inr(rev / paid.length) : "—"}</strong></div></div>
  <div class="two"><div class="card wrapx"><strong>Sales by day</strong>${days.length ? `<table><tr><th>Date</th><th>Orders</th><th>Revenue</th></tr>${days.map(([k, x]) => `<tr><td>${esc(k)}</td><td>${x.n}</td><td>${inr(x.r)}</td></tr>`).join("")}</table>` : `<div class="empty">No paid orders in this period.</div>`}</div>
  <div><div class="card wrapx" style="margin-bottom:14px"><strong>Top products</strong>${top.length ? `<table><tr><th>Product</th><th>Qty</th><th>Revenue</th></tr>${top.map(([n, x]) => `<tr><td>${esc(n)}</td><td>${x.q}</td><td>${inr(x.r)}</td></tr>`).join("")}</table>` : `<div class="empty">No item data.</div>`}</div>
  <div class="card wrapx"><strong>Orders by status</strong><table>${Object.entries(st).map(([k, n]) => `<tr><td><span class="badge ${bc(k)}">${esc(k)}</span></td><td>${n}</td></tr>`).join("") || `<tr><td class="empty">None</td></tr>`}</table></div></div></div>`;
  $("#csv").onclick = () => { const q = s => `"${String(s).replace(/"/g, '""').replace(/^([=+\-@])/, "'$1")}"`, t = ["Date,Orders,Revenue", ...days.map(([k, x]) => [q(k), x.n, x.r].join(","))].join("\n"), a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([t], { type: "text/csv" })); a.download = `sales-${d}d.csv`; a.click(); URL.revokeObjectURL(a.href); };
}

let idle; const resetIdle = () => { clearTimeout(idle); idle = setTimeout(() => signOut(auth).then(() => location.reload()), 30 * 60 * 1000); };
["click", "keydown", "mousemove", "touchstart"].forEach(e => addEventListener(e, () => ROLE && resetIdle(), { passive: true }));
</script></body></html>
